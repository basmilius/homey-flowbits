<!doctype html>
<html>
<head lang="en">
    <title>Step sequence</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body class="homey-widget">

<div class="basic-widget">
    <div class="basic-widget-caption">
        <div class="basic-widget-header">
            <span
                class="basic-widget-header-name"
                id="step-sequence-name">&mdash;</span>
        </div>

        <div
            class="basic-widget-content"
            id="step-sequence-step">
            &mdash;
        </div>
    </div>
</div>

<script type="text/javascript">
    function onHomeyReady(Homey) {
        const stepSequenceName = document.getElementById('step-sequence-name');
        const stepSequenceStep = document.getElementById('step-sequence-step');
        let ready = false;

        const settings = Homey.getSettings();

        async function init() {
            Homey.on('flowbits-cycle-update', (cycle) => {
                if (cycle && cycle.name === settings.cycle.name) {
                    update();
                }
            });

            await update();
        }

        async function update() {
            try {
                const cycle = await Homey.api('GET', `/?cycle=${encodeURIComponent(settings.cycle.name)}`);

                stepSequenceName.innerText = cycle?.name ?? '—';
                stepSequenceStep.innerText = cycle?.step !== undefined && cycle?.step !== null ? cycle.step : '—';
            } catch (error) {
                console.error('Failed to fetch cycle data:', error);
                stepSequenceName.innerText = '—';
                stepSequenceStep.innerText = '—';
            }

            const height = document.body.getBoundingClientRect().height;

            if (ready) {
                await Homey.setHeight(height);
            } else {
                Homey.ready({height});
                ready = true;
            }
        }

        init();
    }
</script>

</body>
</html>
